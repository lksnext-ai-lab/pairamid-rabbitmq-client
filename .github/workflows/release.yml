name: Release package

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Tag must use X.Y.Z format: {tag}")

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          if tag != project_version:
              raise SystemExit(
                  f"Tag version {tag} does not match project.version {project_version}"
              )

      - name: Verify tag commit belongs to main
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${TAG_REF}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" dist/* --verify-tag --generate-notes