name: Test client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies without installing the client
        run: uv sync --frozen --no-install-project --extra dev
      - name: Validate snapshot integrity
        run: uv run --no-sync python scripts/sync_contracts.py --check
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Check types
        run: uv run --no-sync mypy src
      - name: Test
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Build distributions
        run: uv build --no-sources
      - name: Check distributions
        run: uvx twine check dist/*
